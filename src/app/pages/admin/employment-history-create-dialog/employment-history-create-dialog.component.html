<section class="bg-white rounded-lg shadow p-6 z-50 relative max-w-full md:max-w-3xl overflow-visible mt-12">

 <h2 class="text-xl font-semibold text-gray-800 mb-4">
    Agregar nuevo historial laboral
  </h2>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm"
  >
    <!-- Buscar por cédula -->
    <div class="col-span-full">
      <label class="block text-gray-700 font-medium mb-1">Buscar por cédula</label>
      <input
        type="text"
        name="cedula"
        [(ngModel)]="searchCedula"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="searchEmployeeByCedula()"
        placeholder="Ingrese cédula"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300"
      />

      <!-- Mostrar información del empleado -->
      <div
        *ngIf="selectedEmployee"
        class="mt-2 p-2 border border-green-400 bg-green-50 rounded text-sm text-green-800"
      >
        <p><strong>Nombre:</strong> {{ selectedEmployee.first_name }} {{ selectedEmployee.last_name }}</p>
        <p><strong>Correo:</strong> {{ selectedEmployee.user?.email || '-' }}</p>
      </div>

      <!-- Mensaje si no se encuentra -->
      <p *ngIf="searchCedula && !selectedEmployee && notFound" class="text-red-600 mt-2 text-sm">
        No se encontró ningún empleado con esa cédula.
      </p>
    </div>

    <!-- Cargo -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Cargo</label>
      <select formControlName="positionId" class="w-full px-3 py-2 border rounded" required>
        <option value="" disabled selected>Seleccione un cargo</option>
        <option *ngFor="let p of positions" [value]="p.id">{{ p.title }}</option>
      </select>
    </div>

    <!-- Tipo de contrato -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Tipo de contrato</label>
      <select formControlName="contractTypeId" class="w-full px-3 py-2 border rounded" required>
        <option value="" disabled selected>Seleccione un contrato</option>
        <option *ngFor="let c of contracts" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <!-- Salario -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Salario</label>
      <input
        type="number"
        formControlName="salary"
        class="w-full px-3 py-2 border rounded"
        placeholder="Ej: 2500000"
        required
      />
    </div>

    <!-- Fecha de inicio -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Fecha de inicio</label>
      <input
        type="date"
        formControlName="startDate"
        class="w-full px-3 py-2 border rounded"
        required
      />
    </div>

    <!-- Fecha de terminación -->
    <div class="md:col-span-2">
      <label class="block text-gray-700 font-medium mb-1">Fecha de terminación (opcional)</label>
      <input
        type="date"
        formControlName="endDate"
        class="w-full px-3 py-2 border rounded"
      />
    </div>

    <!-- BOTONES -->
    <div class="col-span-full flex justify-end gap-3 mt-4">
      <button
        type="button"
        class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300"
        (click)="onCancel()"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
        [disabled]="form.invalid || !selectedEmployee"
      >
        Guardar
      </button>
    </div>
  </form>
</section>
