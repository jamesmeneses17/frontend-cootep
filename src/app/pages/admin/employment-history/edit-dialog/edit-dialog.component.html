<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm"
>

  <!-- Empleado (solo lectura) -->
  <div>
    <label class="block text-gray-700 font-medium mb-1">Empleado</label>
    <input
      type="text"
      [value]="data?.employee?.first_name + ' ' + data?.employee?.last_name"
      class="w-full px-3 py-2 border rounded bg-gray-100 text-gray-700"
      disabled
    />
  </div>

  <!-- Cédula (solo lectura) -->
  <div>
    <label class="block text-gray-700 font-medium mb-1">Cédula</label>
    <input
      type="text"
      [value]="data?.employee?.national_id"
      class="w-full px-3 py-2 border rounded bg-gray-100 text-gray-700"
      disabled
    />
  </div>

  <!-- Cargo -->
  <div>
    <label class="block text-gray-700 font-medium mb-1">Cargo</label>
    <select formControlName="positionId" class="w-full px-3 py-2 border rounded">
      <option *ngFor="let p of positions" [value]="p.id">{{ p.title }}</option>
    </select>
  </div>

  <!-- Tipo de contrato -->
  <div>
    <label class="block text-gray-700 font-medium mb-1">Tipo de contrato</label>
    <select formControlName="contractTypeId" class="w-full px-3 py-2 border rounded">
      <option *ngFor="let c of contracts" [value]="c.id">{{ c.name }}</option>
    </select>
  </div>

  <!-- Salario -->
  <div>
    <label class="block text-gray-700 font-medium mb-1">Salario</label>
    <input type="number" formControlName="salary" class="w-full px-3 py-2 border rounded" />
  </div>

  <!-- Fecha de inicio -->
  <div>
    <label class="block text-gray-700 font-medium mb-1">Fecha de inicio</label>
    <input type="date" formControlName="startDate" class="w-full px-3 py-2 border rounded" />
  </div>

  <!-- Fecha de terminación (opcional) -->
  <div class="md:col-span-2">
    <label class="block text-gray-700 font-medium mb-1">Fecha de terminación (opcional)</label>
    <input type="date" formControlName="endDate" class="w-full px-3 py-2 border rounded" />
  </div>

  <!-- Botones -->
  <div class="md:col-span-2 flex justify-end gap-3 mt-4">
    <button type="button" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400" (click)="onCancel()">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Guardar cambios
    </button>
  </div>
</form>
