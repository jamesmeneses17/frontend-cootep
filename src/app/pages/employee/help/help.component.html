<div class="flex min-h-screen bg-gray-100 overflow-hidden">
  <!-- SIDEBAR -->
  <div
    class="fixed inset-0 z-40 flex md:static md:inset-auto md:translate-x-0 transition-transform duration-300 ease-in-out"
    [class.-translate-x-full]="!sidebarOpen"
  >
    <app-sidebar></app-sidebar>
    <div
      class="fixed inset-0 bg-black bg-opacity-50 md:hidden"
      (click)="sidebarOpen = false"
    ></div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- HEADER -->
    <app-header
      [profile]="profile"
      [sidebarOpen]="sidebarOpen"
      [toggleSidebar]="toggleSidebar.bind(this)"
    ></app-header>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto px-4 py-8">
      <section class="bg-white rounded-lg shadow max-w-4xl mx-auto px-6 py-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 uppercase">
          Ayuda y Preguntas Frecuentes
        </h1>

        <div class="space-y-4">
          <div
            *ngFor="let faq of faqs; let i = index"
            class="border border-gray-200 rounded shadow"
          >
            <button
              (click)="toggleFaq(i)"
              class="w-full text-left px-4 py-3 font-semibold text-gray-800 flex justify-between items-center"
            >
              {{ faq.question }}
              <span
                class="transform transition-transform duration-300"
                [class.rotate-180]="faq.open"
              >
                ▼
              </span>
            </button>
            <div
              *ngIf="faq.open"
              class="px-4 pb-4 text-gray-600 text-sm border-t border-gray-200"
            >
              {{ faq.answer }}
            </div>
          </div>
        </div>

        <div class="mt-10 text-center text-xs text-gray-500">
          ¿Tienes más dudas? Contáctanos a soportecootep.org
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <app-footer></app-footer>
  </div>
</div>
