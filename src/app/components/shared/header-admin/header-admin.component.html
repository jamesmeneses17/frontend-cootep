<header class="header-admin">
  <div class="header-container">
    <!-- Sección izquierda con logo y título -->
    <div class="header-left">
      <!-- Botón hamburguesa móvil -->
      <button class="mobile-menu-btn" (click)="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>

      <!-- Logo y branding -->
      <div class="header-brand">
        <div class="brand-info">
          <h1 class="brand-title">Panel Administrativo</h1>
        </div>
      </div>
    </div>

    <!-- Sección derecha con controles -->
    <div class="header-right">
      <!-- Indicador de estado -->
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span class="status-text">Sistema Activo</span>
      </div>

      <!-- Dropdown de usuario -->
      <div class="user-dropdown" (click)="toggleMenu()" tabindex="0">
        <button class="user-btn">
          <div class="user-avatar">
            <i class="fas fa-user-shield"></i>
          </div>
          <div class="user-info">
            <span class="user-name">Administrador</span>
            <span class="user-role">Super Admin</span>
          </div>
          <i class="fas fa-chevron-down dropdown-arrow"></i>
        </button>

        <div *ngIf="menuOpen" class="dropdown-menu">
          <div class="dropdown-header">
            <div class="dropdown-avatar">
              <i class="fas fa-user-shield"></i>
            </div>
            <div class="dropdown-user-info">
              <span class="dropdown-name">Administrador</span>
              <span class="dropdown-email">admincootep.com.co</span>
            </div>
          </div>
          <div class="dropdown-divider"></div>

          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
