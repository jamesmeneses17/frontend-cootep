<!-- Header -->
<header class="bg-[#007b01] text-white py-4 shadow">
  <div
    class="w-full px-6 flex flex-col md:flex-row justify-between items-center gap-2"
  >
    <h1 class="text-2xl font-bold">CootepCert</h1>
    <nav class="flex gap-6 text-sm">
      <a href="#" class="hover:underline">Inicio</a>
      <a href="#" class="hover:underline">Soporte</a>
      <a href="#" class="font-semibold underline">Iniciar sesión</a>
    </nav>
  </div>
</header>

<!-- Main Login Section -->
<main class="min-h-[calc(100vh-112px)] bg-white px-4 py-8 md:py-12">
  <div
    class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8"
  >
    <!-- Formulario -->

    <form
      class="w-full md:w-1/2 px-6 text-center md:text-left"
      (ngSubmit)="onSubmit()"
    >
      <h2 class="text-3xl font-bold text-gray-900 mb-2 text-center">
        Iniciar Sesión
      </h2>

      <p class="text-sm text-gray-600 mb-6 text-center">
        Ingresa tus credenciales para acceder:
      </p>

      <!-- Campo correo -->
      <div class="mb-4 relative">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
          >Correo electrónico</label
        >
        <div class="relative">
          <span
            class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"
          >
            <i class="fas fa-envelope"></i>
          </span>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            class="w-full pl-10 pr-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#008000]"
            required
          />
        </div>
      </div>

      <!-- Campo contraseña -->
      <div class="mb-6 relative">
        <label
          for="password"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Contraseña</label
        >
        <div class="relative">
          <span
            class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"
          >
            <i class="fas fa-lock"></i>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            class="w-full pl-10 pr-10 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#008000]"
            required
          />
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400"
            tabindex="-1"
          >
            <i
              class="fas"
              [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            ></i>
          </button>
        </div>
      </div>

      <button
  type="submit"
  class="w-full bg-[#008000] text-white py-2 rounded-full hover:bg-[#fef804] hover:text-black transition-colors duration-300 text-sm"
>
  Iniciar sesión
</button>


      <div class="mt-4 text-sm text-[#008000]">
        <a href="#" class="hover:underline">¿Olvidaste tu contraseña?</a>
      </div>
    </form>

    <!-- Imagen decorativa -->
    <div class="flex w-full md:w-1/2 justify-center items-center">
      <img
        src="assets/cootep.png"
        alt="Login visual"
        class="max-w-[500px] w-full h-auto object-contain"
      />
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="bg-[#007b01] text-white text-center py-4">
  © 2025 CootepCert. Todos los derechos reservados.
</footer>
